# ============================================================
#  Nginx — entrada única do sistema (porta 8087 no host)
#  /api/* → backend (Express)   |   /* → build estático (dist/)
#  Em produção fica atrás do nginx do servidor, que termina o
#  HTTPS e repassa o Host original.
# ============================================================

# www → domínio principal (uma URL só para os buscadores)
server {
  listen 80;
  server_name www.dyonedev.com.br;
  return 301 https://dyonedev.com.br$request_uri;
}

server {
  listen 80 default_server;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  # IP real do visitante: quem conecta aqui é o nginx do servidor (via rede
  # do Docker), e o IP de verdade vem no X-Forwarded-For que ele envia.
  set_real_ip_from 127.0.0.0/8;
  set_real_ip_from 10.0.0.0/8;
  set_real_ip_from 172.16.0.0/12;
  set_real_ip_from 192.168.0.0/16;
  real_ip_header X-Forwarded-For;

  gzip on;
  gzip_comp_level 6;
  gzip_min_length 1024;
  gzip_vary on;
  gzip_proxied any;
  gzip_types text/css text/plain text/markdown text/xml application/javascript application/json application/xml application/ld+json image/svg+xml;

  include /etc/nginx/snippets/cabecalhos.conf;

  # Página inexistente devolve 404 de verdade (o site tem uma página só)
  error_page 404 /404.html;
  location = /404.html {
    internal;
    include /etc/nginx/snippets/cabecalhos.conf;
    add_header Cache-Control "no-cache";
  }

  # API de contato → backend
  location /api/ {
    proxy_pass http://backend:3002;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # JS/CSS do build têm hash no nome: cache longo e imutável
  location /assets/ {
    include /etc/nginx/snippets/cabecalhos.conf;
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }

  # Conteúdo em Markdown para IAs (llmstxt.org)
  location = /llms.txt {
    types { }
    default_type "text/markdown; charset=utf-8";
    include /etc/nginx/snippets/cabecalhos.conf;
    add_header Cache-Control "public, max-age=3600";
  }

  # Modelo 3D, imagens e ícones: nome fixo, então cache de 1 dia
  location ~* \.(glb|png|jpe?g|ico|svg|webp)$ {
    include /etc/nginx/snippets/cabecalhos.conf;
    add_header Cache-Control "public, max-age=86400";
    try_files $uri =404;
  }

  # HTML sempre revalidado, para um deploy aparecer na hora
  location = / {
    include /etc/nginx/snippets/cabecalhos.conf;
    add_header Cache-Control "no-cache";
    try_files /index.html =404;
  }

  location / {
    try_files $uri =404;
  }
}
