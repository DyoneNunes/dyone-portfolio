# ============================================================
#  Portfólio — stack completa (6 serviços / 6 portas)
#  Rodar:  docker compose up -d --build
#  Logs:   docker compose logs -f
#  Parar:  docker compose down        (dados do banco persistem)
#
#  PORTAS NO HOST — faixa deslocada +6 para não colidir com os
#  outros serviços desta máquina (NirMind etc. usam 3001, 5432,
#  5433, 6379, 8080, 8081...):
#    8087 → nginx     entrada única (app + api)
#    5179 → frontend  Vite dev direto (5173 interno)
#    3008 → backend   API de contato (3002 interno)
#    5440 → postgres  leads do formulário (5432 interno)
#    6386 → redis     rate-limit persistente (6379 interno)
#    8088 → adminer   UI de inspeção do banco (8080 interno)
# ============================================================
services:
  # ---------- entrada única ----------
  nginx:
    image: nginx:alpine
    container_name: portfolio-nginx
    restart: unless-stopped
    ports:
      - '8087:80' # 8081/8082+ do host pertencem a outros serviços
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      frontend:
        condition: service_started
      backend:
        condition: service_healthy
    networks:
      - rede-portfolio

  # ---------- aplicação ----------
  frontend:
    build: .
    container_name: portfolio-frontend
    restart: unless-stopped
    ports:
      - '5179:5173' # host 5179 → Vite interno 5173
    environment:
      # O proxy do Vite (/api) aponta para o serviço backend
      # pelo NOME na rede interna do Docker — não por localhost.
      - BACKEND_URL=http://backend:3002
    volumes:
      - .:/app # hot reload do código
      - /app/node_modules # preserva os node_modules da imagem
    depends_on:
      backend:
        condition: service_healthy # só sobe após o backend responder
    networks:
      - rede-portfolio

  backend:
    build: ./backend
    container_name: portfolio-backend
    restart: unless-stopped
    ports:
      - '3008:3002' # host 3008 → API interna 3002
    env_file:
      - .env # credenciais fora da imagem (e fora do git)
    volumes:
      - ./backend:/app
      - /app/node_modules
    healthcheck:
      # 127.0.0.1 explícito: o wget do busybox tenta ::1 (IPv6) primeiro
      # e não faz fallback — mas o Node escuta em 0.0.0.0 (IPv4)
      test: ['CMD', 'wget', '-qO-', 'http://127.0.0.1:3002/api/saude']
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - rede-portfolio

  # ---------- dados ----------
  postgres:
    image: postgres:16-alpine
    container_name: portfolio-postgres
    restart: unless-stopped
    ports:
      - '5440:5432' # 5432/5433/5434+ do host já estão ocupadas
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data # leads sobrevivem ao down
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB']
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    networks:
      - rede-portfolio

  redis:
    image: redis:7-alpine
    container_name: portfolio-redis
    restart: unless-stopped
    ports:
      - '6386:6379' # 6379 do host já está ocupada
    healthcheck:
      test: ['CMD-SHELL', 'redis-cli ping | grep PONG']
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - rede-portfolio

  # ---------- ferramentas ----------
  adminer:
    image: adminer:latest
    container_name: portfolio-adminer
    restart: unless-stopped
    ports:
      - '8088:8080'
    environment:
      - ADMINER_DEFAULT_SERVER=postgres
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - rede-portfolio

volumes:
  pgdata:

networks:
  rede-portfolio:
    driver: bridge
